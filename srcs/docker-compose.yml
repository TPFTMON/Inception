  #     - inception_net


networks:
  inception_net:
    driver: bridge

volumes:
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      # device: /home/abaryshe/data/wordpress
      device: /home/TPFTMON/data/wordpress

  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      # device: /home/abaryshe/data/mariadb
      device: /home/TPFTMON/data/mariadb
