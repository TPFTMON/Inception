services:

  nginx:
    container_name: nginx
    build:
      context: requirements/nginx
      # dockerfile: Dockerfile
    networks:
      - inception_net
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    env_file:
      - .env
    restart: always

  mariadb:
    container_name: mariadb
    build:
      context: requirements/mariadb
    networks:
      - inception_net
    volumes:
      - mariadb_data:/var/lib/mysql
    env_file:
      - .env
    restart: always

  wordpress:
    container_name: wordpress
    build:
      context: requirements/wordpress
    depends_on:
      - mariadb
    networks:
      - inception_net
    volumes:
      - wordpress_data:/var/www/html
    env_file:
      - .env
    restart: always


# Bonuses:
  adminer:
    container_name: adminer
    build: requirements/bonus/adminer
    depends_on:
      - mariadb
    networks:
      - inception_net
    ports:
      - "8080:8080"
    restart: always

  static-site:
    container_name: static-site
    build: requirements/bonus/static-site
    networks:
      - inception_net
    ports:
      - "8081:8081"
    restart: always

  cadvisor:
    container_name: cadvisor
    build: requirements/bonus/cadvisor
    networks:
      - inception_net
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro # Provides access to the host root filesystem structure.
      - /var/run:/var/run:ro # Allows cAdvisor to communicate with /var/run/docker.sock to inspect container metadata.
      - /sys:/sys:ro # Provides access to Linux cgroups (control groups) and sysfs, where the kernel logs resource consumption for each container.
      - /var/lib/docker/:/var/lib/docker:ro # Allows cAdvisor to inspect Docker's local storage drivers and disk space usage per image/container.
    restart: always


networks:
  inception_net:
    driver: bridge

volumes:
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      # device: /home/abaryshe/data/wordpress
      device: /home/TPFTMON/data/wordpress

  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      # device: /home/abaryshe/data/mariadb
      device: /home/TPFTMON/data/mariadb
