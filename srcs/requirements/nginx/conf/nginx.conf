events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        # Strictly require TLS and listen on port 443
        listen 443 ssl;
        listen [::]:443 ssl;

        # The domain name associated with this server
        # server_name abaryshe.42.fr;
        server_name tpftmon.42.fr;

        # TLS version requirements (subject strictly forbids older versions)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /etc/nginx/ssl/inception.crt;
        ssl_certificate_key /etc/nginx/ssl/inception.key;

        # The folder where the website files live
        root /var/www/html;

        # The first file NGINX will look for when someone visits the domain
        index index.php index.html index.htm;

        # What to do when a user visits the root domain
        location / {
            try_files $uri $uri/ =404;
        }

        # What to do when NGINX encounters a PHP file (like WordPress)
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass wordpress:9000;
        }
    }
}